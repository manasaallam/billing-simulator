spring:
  application:
    name: billing-simulator

  # Default to the Supabase datasource below.
  # Run with -Dspring.profiles.active=dev to use the in-memory H2 profile instead.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

  # --- Supabase (PostgreSQL) ---
  # Provide these via environment variables (never commit real secrets):
  #   SUPABASE_DB_URL, SUPABASE_DB_USER, SUPABASE_DB_PASSWORD
  #
  # Transaction pooler (recommended, Supabase -> Settings -> Database -> Connection pooling):
  #   url:  jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
  #   user: postgres.<project-ref>
  # Direct connection (migrations / low concurrency):
  #   url:  jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
  #   user: postgres
  datasource:
    # Supabase connection pooler (port 6543) — works where direct port 5432 is blocked.
    # Direct connection: jdbc:postgresql://db.eufqlrsyxjbgyyxwntke.supabase.co:5432/postgres?sslmode=require
    url: jdbc:postgresql://db.eufqlrsyxjbgyyxwntke.supabase.co:6543/postgres?sslmode=require&pgbouncer=true
    username: postgres
    password: SSIWt4eKey1xiSpB
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      initialization-fail-timeout: 10000

  jpa:
    # Dialect set explicitly so Hibernate does not need a live connection at startup
    # to auto-detect it (avoids NullPointerException when Supabase is unreachable).
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Schema is managed by the standalone scripts in /database (run in Supabase),
      # so Hibernate must NOT create or alter tables.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# JWT session-token settings.
# Override JWT_SECRET in production — must be at least 32 bytes for HS256.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-billing-simulator-jwt-secret-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
