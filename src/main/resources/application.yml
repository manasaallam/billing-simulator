spring:
  application:
    name: billing-simulator

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/billing_simulator
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

groq:
  api:
    key: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  model: llama-3.1-8b-instant