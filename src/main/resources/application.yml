spring:
  application:
    name: billing-simulator

  # Default to the Supabase datasource below.
  # Run with -Dspring.profiles.active=dev to use the in-memory H2 profile instead.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

  # --- Google Cloud SQL (PostgreSQL) ---
  # Provide these via environment variables (never commit real secrets):
  #   DB_URL, DB_USER, DB_PASSWORD
  #
  # Cloud SQL instance:
  #   Connection name: qwiklabs-gcp-03-8cbb6b09ddfc:us-central1:billing-simulation-data
  #   Public IP:       136.64.249.194   (port 5432)
  #   Database:        billing-simulation-db
  #
  # Two ways to connect:
  #   1. Cloud SQL Socket Factory (recommended, uses ADC / service account):
  #      DB_URL=jdbc:postgresql:///billing-simulation-db?cloudSqlInstance=qwiklabs-gcp-03-8cbb6b09ddfc:us-central1:billing-simulation-data&socketFactory=com.google.cloud.sql.postgres.SocketFactory
  #   2. Direct Public IP (requires your IP in Cloud SQL Authorized Networks):
  #      DB_URL=jdbc:postgresql://136.64.249.194:5432/billing-simulation-db?sslmode=require
  datasource:
    url: ${DB_URL:jdbc:postgresql:///billing-simulation-db?cloudSqlInstance=qwiklabs-gcp-03-8cbb6b09ddfc:us-central1:billing-simulation-data&socketFactory=com.google.cloud.sql.postgres.SocketFactory}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:TechHunter@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      initialization-fail-timeout: 10000

  jpa:
    # Dialect set explicitly so Hibernate does not need a live connection at startup
    # to auto-detect it (avoids NullPointerException when Supabase is unreachable).
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Schema is managed by the standalone scripts in /database (run in Supabase),
      # so Hibernate must NOT create or alter tables.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

server:
  port: 8080

# JWT session-token settings.
# Override JWT_SECRET in production — must be at least 32 bytes for HS256.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-billing-simulator-jwt-secret-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
