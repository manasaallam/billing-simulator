spring:
  datasource:
    url: jdbc:h2:mem:billing_simulator
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

# Gemini AI — set GEMINI_API_KEY env variable to activate real AI
# Without it, LocalRuleBasedAiClient is used (regex patterns)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash
